name: inmotion_mobile_test
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.1
  get_it: ^7.6.7
  auto_route: ^7.8.4
  spider: ^4.2.2
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.2
  expansion_widget: ^0.0.3
  syncfusion_flutter_charts: ^30.1.40
  collection: ^1.18.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  wakelock_plus: ^1.2.1
  intl: ^0.20.2
  uuid: ^4.3.3
  syncfusion_flutter_xlsio: ^30.1.40
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  flutter_blue_plus: ^1.35.5
  hex: ^0.2.0
  ieee754: ^1.0.3
  typed_data: ^1.3.2
  vector_math: ^2.1.4
  yandex_mapkit: ^4.0.2
  calendar_date_picker2: ^1.0.2
  hive_flutter: ^1.1.0
  talker_flutter: ^4.2.4
  crclib: ^3.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^7.3.2
  build_runner:
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.webp"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: RobotoMedium
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf